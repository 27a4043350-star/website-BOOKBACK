<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ưu đãi đặc biệt – BOOKBACK</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #14261d;
      }

      /* Nền trang chủ hiển thị phía sau */
      .bg-homepage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
        z-index: 1;
      }

      /* Lớp phủ làm tối mờ nền trang chủ */
      .popup-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 28, 21, 0.62);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 10;
        animation: fadeIn 0.25s ease-out;
      }

      /* Khung Pop-up chính giữa */
      .promo-modal {
        position: relative;
        width: 100%;
        max-width: 470px;
        border-radius: 24px;
        border: 6px solid #fffdf8;
        background: linear-gradient(
          180deg,
          #1d4d3b 0%,
          #2b614c 52%,
          #f6efe0 100%
        );
        box-shadow: 0 24px 54px rgba(0, 0, 0, 0.38);
        padding: 26px 22px 22px;
        text-align: center;
        animation: popScale 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Nút X tròn nổi ở góc trên bên phải */
      .promo-close-btn {
        position: absolute;
        top: -15px;
        right: -15px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #eadfc6;
        background: #ffffff;
        color: #1d4d3b;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          color 0.2s ease;
      }

      .promo-close-btn:hover {
        background: #1d4d3b;
        color: #fffdf8;
        transform: rotate(90deg);
      }

      .promo-script {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 1rem;
        color: #f3dfb3;
        margin-bottom: 2px;
      }

      .promo-brand {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #fffdf8;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      .promo-pill {
        display: inline-block;
        background: #c69b4b;
        color: #183529;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        padding: 5px 16px;
        border-radius: 999px;
        margin-bottom: 16px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
      }

      .promo-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      .promo-deal {
        background: #fffdf8;
        border: 1.5px solid #e6d7b5;
        border-radius: 16px;
        padding: 14px 10px;
        box-shadow: 0 6px 14px rgba(29, 77, 59, 0.12);
      }

      .deal-tag {
        font-size: 0.72rem;
        font-weight: 800;
        color: #1d4d3b;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .deal-sub {
        font-size: 0.7rem;
        color: #6b726e;
        margin-bottom: 4px;
      }

      .deal-value {
        font-size: 2rem;
        font-weight: 900;
        line-height: 1.05;
        color: #1d4d3b;
        margin: 4px 0;
      }

      .deal-code {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        background: #edf3ef;
        color: #1d4d3b;
        padding: 2px 9px;
        border-radius: 999px;
      }

      .promo-perks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        background: rgba(255, 253, 248, 0.92);
        border-radius: 14px;
        padding: 10px 8px;
        margin-bottom: 16px;
      }

      .perk-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .perk-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1d4d3b;
        color: #f3dfb3;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .perk-text {
        font-size: 0.65rem;
        font-weight: 700;
        line-height: 1.25;
        color: #263b31;
      }

      .promo-cta {
        display: inline-block;
        width: 100%;
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #1d4d3b 0%, #2d6650 100%);
        color: #fffdf8;
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
        box-shadow: 0 8px 18px rgba(29, 77, 59, 0.28);
        transition:
          transform 0.2s ease,
          color 0.2s ease;
      }

      .promo-cta:hover {
        transform: translateY(-2px);
        color: #f3dfb3;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes popScale {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 480px) {
        .promo-modal {
          padding: 22px 14px 18px;
          border-width: 4px;
        }
        .promo-close-btn {
          top: -12px;
          right: -8px;
        }
        .deal-value {
          font-size: 1.65rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Nền trang chủ thực tế ở phía sau -->
    <iframe
      class="bg-homepage"
      id="bgHomepage"
      src="../index.html"
      title="Trang chủ BOOKBACK"
      tabindex="-1"
    ></iframe>

    <!-- Lớp phủ & Pop-up -->
    <div
      class="popup-backdrop"
      id="popupBackdrop"
      role="dialog"
      aria-modal="true"
      aria-label="Ưu đãi độc quyền BOOKBACK"
    >
      <div class="promo-modal">
        <button
          type="button"
          class="promo-close-btn"
          id="closePopupBtn"
          aria-label="Đóng và vào trang chủ"
        >
          &times;
        </button>

        <p class="promo-script">Chào mừng bạn đến với</p>
        <h1 class="promo-brand">BOOKBACK</h1>
        <div class="promo-pill">ƯU ĐÃI SINH VIÊN HVNH – MUA SÁCH LÀ LỜI!</div>

        <div class="promo-cards">
          <div class="promo-deal">
            <div class="deal-tag">⚡ BẠN MỚI</div>
            <div class="deal-sub">Giảm ngay</div>
            <div class="deal-value">15%</div>
            <span class="deal-code">Mã: LANDAU15</span>
          </div>

          <div class="promo-deal">
            <div class="deal-tag">🎁 TRI ÂN 20/11</div>
            <div class="deal-sub">Ưu đãi đặc biệt</div>
            <div class="deal-value">20%</div>
            <span class="deal-code">Mã: TRIAN2011</span>
          </div>
        </div>

        <div class="promo-perks">
          <div class="perk-item">
            <span class="perk-icon">⚡</span>
            <span class="perk-text">FLASH SALE<br />Giảm 20K</span>
          </div>
          <div class="perk-item">
            <span class="perk-icon">%</span>
            <span class="perk-text">GIẢM TỚI 20%<br />Đơn giáo trình</span>
          </div>
          <div class="perk-item">
            <span class="perk-icon">🎁</span>
            <span class="perk-text">FREESHIP<br />Tại 12 Chùa Bộc</span>
          </div>
          <div class="perk-item">
            <span class="perk-icon">✓</span>
            <span class="perk-text">SÁCH CHỌN LỌC<br />Độ mới &gt;70%</span>
          </div>
        </div>

        <a href="promotion.html" class="promo-cta" id="promoCtaLink"
          >KHÁM PHÁ ƯU ĐÃI NGAY &rsaquo;</a
        >
      </div>
    </div>

    <script>
      const isInPagesFolder = window.location.pathname
        .replace(/\\/g, "/")
        .includes("/pages/");
      const homeUrl = isInPagesFolder ? "../index.html" : "index.html";
      const promoUrl = isInPagesFolder
        ? "promotion.html"
        : "pages/promotion.html";

      const bgFrame = document.getElementById("bgHomepage");
      const ctaLink = document.getElementById("promoCtaLink");
      const closeBtn = document.getElementById("closePopupBtn");
      const backdrop = document.getElementById("popupBackdrop");

      if (bgFrame) bgFrame.src = homeUrl;
      if (ctaLink) ctaLink.href = promoUrl;

      function goToHomePage() {
        window.location.replace(homeUrl);
      }

      // Bấm nút X -> đóng pop-up và mở trang chủ
      closeBtn.addEventListener("click", goToHomePage);

      // Bấm ra vùng nền tối bên ngoài -> đóng pop-up và mở trang chủ
      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) {
          goToHomePage();
        }
      });

      // Bấm phím Esc -> đóng pop-up và mở trang chủ
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          goToHomePage();
        }
      });
    </script>
  </body>
</html>
